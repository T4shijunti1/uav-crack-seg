# ============================================================
# Conda 环境文件：一键复现实验环境
# 用法：
#   conda env create -f environment.yml
#   conda activate uav_crack
# 已验证：Windows 11 / Python 3.11 / CUDA 12.8 / RTX 50 系
# ============================================================
name: uav_crack

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - pip:
      # PyTorch（CUDA 12.8 构建）
      - --index-url https://download.pytorch.org/whl/cu128
      - --extra-index-url https://pypi.org/simple
      - torch==2.11.0
      - torchvision==0.26.0
      # OpenMMLab：mmcv 使用纯 Python 的 mmcv-lite（算子由仓库内桩补齐）
      - mmengine==0.10.7
      - mmcv-lite==2.1.0
      - mmsegmentation==1.2.2
      # 数值与图像处理
      - numpy==2.4.6
      - scipy==1.17.1
      - opencv-python==5.0.0.93
      - pillow==12.3.0
      - matplotlib==3.11.2
      - timm==1.0.29
      - prettytable==3.18.0
      - tqdm==4.70.1
      - PyYAML==6.0.3
      - addict==2.4.0
      - yapf==0.43.0
      - ftfy==6.3.1
      # ONNX 导出与校验（仅导出时需要）
      - onnx>=1.14
      - onnxruntime>=1.16
